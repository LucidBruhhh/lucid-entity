<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>AEON · intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--lime:#c7ff16;--c:#c7ff16;--e:199,255,22;--el:#eaffb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;font-family:Rajdhani,Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.brand{position:fixed;top:max(14px,calc(env(safe-area-inset-top) + 6px));left:16px;z-index:5;font:700 11px/1 Rajdhani,Arial,sans-serif;letter-spacing:.08em;opacity:.9}
.brand i{font-style:normal;background:var(--lime);color:#000;padding:2px 4px 1px;margin-left:3px}
.ctl{position:fixed;top:max(10px,calc(env(safe-area-inset-top) + 2px));right:12px;z-index:9;display:flex;gap:8px}
.ctl button{min-width:44px;height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font:700 11px/1 Rajdhani,Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer}
.ctl button.off{color:rgba(255,255,255,.45)}
.head{position:fixed;left:0;right:0;top:max(64px,calc(env(safe-area-inset-top) + 56px));text-align:center;z-index:5;pointer-events:none}
.q1{font:500 clamp(18px,5.6vw,26px)/1 Rajdhani,Arial,sans-serif;letter-spacing:.14em;color:#e8f0d8;opacity:0;transition:opacity .4s}
.q2{margin-top:6px;font:400 clamp(30px,10vw,46px)/1 "Russo One",Rajdhani,sans-serif;letter-spacing:.02em;color:var(--c);text-shadow:0 0 18px var(--c),-2px 0 rgba(255,45,180,.5),2px 0 rgba(60,230,255,.5);opacity:0;transition:opacity .4s}
.show .q1,.show .q2{opacity:1}
.hud{position:fixed;left:16px;bottom:max(150px,calc(env(safe-area-inset-bottom) + 142px));z-index:5;font:400 9px/1.6 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);opacity:0;transition:opacity .3s}
.hud b{color:#fff;font-weight:700}.counting .hud{opacity:1}
.code{position:fixed;left:0;right:0;bottom:max(96px,calc(env(safe-area-inset-bottom) + 88px));text-align:center;z-index:5;font:400 clamp(26px,9vw,40px)/1 "Russo One",Rajdhani,sans-serif;color:var(--c);text-shadow:0 0 16px var(--c);pointer-events:none}
.say{position:fixed;left:24px;right:24px;bottom:max(96px,calc(env(safe-area-inset-bottom) + 88px));text-align:center;z-index:5;font:300 italic clamp(20px,6vw,26px)/1.3 "Cormorant Garamond",Georgia,serif;color:#fff;text-shadow:0 0 18px rgba(63,224,255,.5);pointer-events:none;opacity:0;transition:opacity .5s}
.say.on{opacity:1}
.guess{position:fixed;left:50%;bottom:max(70px,calc(env(safe-area-inset-bottom) + 62px));transform:translateX(-50%);z-index:6;text-align:center;opacity:0;pointer-events:none;transition:opacity .5s}
.prompt{position:fixed;left:0;right:0;bottom:max(64px,calc(env(safe-area-inset-bottom) + 56px));text-align:center;z-index:5;pointer-events:none;opacity:0;transition:opacity .6s}
.asking .prompt{opacity:1}
.prompt b{display:block;font:700 15px/1 Rajdhani,Arial,sans-serif;letter-spacing:.55em;margin-right:-.55em;color:var(--el);text-transform:uppercase;text-shadow:0 0 14px var(--lime);animation:breathe 1.8s ease-in-out infinite}
.prompt span{display:block;margin-top:10px;font:400 10px/1 "JetBrains Mono",monospace;letter-spacing:.32em;color:rgba(var(--e),.6);text-transform:uppercase}
.charging .prompt b{animation:none;color:#fff}
.guess p{margin:0 0 12px;font:400 11px/1 "JetBrains Mono",monospace;letter-spacing:.3em;color:rgba(255,255,255,.6);text-transform:uppercase}
.guess div{display:flex;gap:10px}
.guess button{width:84px;height:58px;border-radius:14px;border:1px solid rgba(var(--e),.5);background:rgba(10,14,4,.6);backdrop-filter:blur(8px);color:#fff;font:400 24px/1 "Russo One",Rajdhani,sans-serif;cursor:pointer;box-shadow:0 0 18px rgba(var(--e),.18);transition:transform .15s}
.guess button:active{transform:scale(.92)}
.tapcue{position:fixed;left:0;right:0;bottom:max(40px,calc(env(safe-area-inset-bottom) + 30px));text-align:center;z-index:5;font:700 12px/1 Rajdhani,Arial,sans-serif;letter-spacing:.5em;margin-right:-.5em;color:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
.tapcue.on{opacity:1;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.3}}
.final{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);z-index:6;text-align:center;opacity:0;pointer-events:none;transition:opacity 1.2s}
.done .final{opacity:1;pointer-events:auto}
.final .logo{margin-top:52vh;font:300 clamp(56px,18vw,100px)/.9 "Cormorant Garamond",Georgia,serif;letter-spacing:.3em;margin-right:-.3em;text-shadow:-2px 0 rgba(255,45,180,.6),2px 0 rgba(60,230,255,.6),0 0 40px rgba(63,224,255,.5)}
.final .sub{margin-top:10px;font:700 12px/1 Rajdhani,Arial,sans-serif;letter-spacing:.6em;margin-right:-.6em;color:var(--lime)}
.final a{display:inline-block;margin-top:22px;padding:15px 34px;border-radius:999px;background:var(--lime);color:#000;text-decoration:none;font:700 14px/1 Rajdhani,Arial,sans-serif;letter-spacing:.42em;margin-right:-.42em;text-transform:uppercase;box-shadow:0 0 34px rgba(var(--e),.6)}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
.scan{position:fixed;inset:0;pointer-events:none;z-index:4;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.scan::after{content:"";position:absolute;left:0;right:0;height:22%;background:linear-gradient(transparent,rgba(var(--e),.06),transparent);animation:roll 4.2s linear infinite}
@keyframes roll{from{top:-25%}to{top:110%}}
.vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(120% 85% at 50% 48%,transparent 48%,rgba(0,0,0,.82))}
.head,.code,.say,.counting .hud{animation:holo 5s steps(1) infinite}
@keyframes holo{0%,100%{opacity:1;transform:none}91%{opacity:.75}92%{opacity:1;transform:translateX(2px)}93%{transform:translateX(-1px) skewX(-6deg)}94%{transform:none}97%{opacity:.85}}
.q2,.code{text-shadow:0 0 18px var(--c),0 0 2px #fff,-1px 0 rgba(120,255,255,.45)!important}
.guess button{background:rgba(6,14,2,.5)!important;border:1px solid rgba(var(--e),.75)!important;box-shadow:0 0 16px rgba(var(--e),.35),inset 0 0 14px rgba(var(--e),.18)!important;color:var(--el)!important;text-shadow:0 0 10px var(--lime);background-image:repeating-linear-gradient(0deg,rgba(var(--e),.08) 0 1px,transparent 1px 3px)!important}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;z-index:7;background:#000;transition:opacity 1.1s}
.handoff #game{opacity:1;pointer-events:auto}.handoff .ctl{z-index:9;top:auto;bottom:max(10px,calc(env(safe-area-inset-bottom) + 2px));right:10px}.handoff #snd,.handoff #skip{display:none}.handoff #replay{opacity:.7}.handoff .brand,.handoff .head,.handoff .hud,.handoff .code,.handoff .say{display:none}
.themes{position:fixed;left:14px;top:max(40px,calc(env(safe-area-inset-top) + 32px));z-index:9;display:flex;gap:7px;align-items:center}
.themes button{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.35);cursor:pointer;padding:0;box-shadow:0 0 8px rgba(0,0,0,.6)}
.themes button.on{outline:2px solid #fff;outline-offset:2px}
.themes span{font:400 8px/1 "JetBrains Mono",monospace;letter-spacing:.2em;color:rgba(255,255,255,.55);text-transform:uppercase;margin-left:4px}
.handoff .themes{display:none}
.themes{display:none} /* the picker is retired now a theme is chosen */
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="brand">LUCID<i>INSTINCT</i></div>
<div class="themes" id="themes"></div>
<div class="ctl"><button id="replay" aria-label="Replay the intro">&#8634; replay</button><button id="snd" aria-label="Sound on or off">&#9835; on</button><button id="skip">skip</button></div>
<div class="head" id="head"><div class="q1" id="q1">HOW MANY SHAPES</div><div class="q2" id="q2">CAN YOU FIND?</div></div>
<div class="hud" id="hud">shapes found <b id="cnt">00</b> / 16<br>lines 78 · circles 13<br>metatron's cube</div>
<div class="code" id="code"></div>
<div class="say" id="say"></div>
<div class="prompt" id="prompt"><b id="pr1">touch the cube</b><span id="pr2">drag it · feel it</span></div>
<div class="tapcue" id="tapcue">tap the egg</div>
<div class="final"><div class="logo">AEON</div><div class="sub">SCANNER GIZMO</div><a href="../" id="enter">enter</a></div>
<div class="scan"></div><div class="vig"></div>
<div class="flash" id="flash"></div>

const COLS = [TH.eh]; // one energy colour per theme, on purpose: no rainbow
const GLYPH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@%&';

/* ---------- Metatron's cube: 13 points (centre, inner ring, outer ring), every pair joined ---------- */
const PTS = [[0, 0]]; for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + i * Math.PI / 3; PTS.push([Math.cos(a) * .5, Math.sin(a) * .5]); } for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + i * Math.PI / 3; PTS.push([Math.cos(a), Math.sin(a)]); }
// 0 centre · 1..6 inner ring from the top, clockwise · 7..12 outer ring from the top, clockwise
const LINES = []; for (let a = 0; a < 13; a++) for (let b = a + 1; b < 13; b++) LINES.push([a, b]);
const P = i => [CX + PTS[i][0] * R, CY + PTS[i][1] * R];

/* ---------- the shapes to find: ten flat ones on single beats, then five solids that break out into 3D, then the flower ---------- */
const FLAT = [
  { name: 'TRIANGLE', pts: [7, 9, 11] }, { name: 'TRIANGLE', pts: [8, 10, 12] }, { name: 'HEXAGRAM', star: [[7, 9, 11], [8, 10, 12]] },

];
const PHI = (1 + Math.sqrt(5)) / 2;
const nrm = V => { const m = Math.max(...V.map(v => Math.hypot(...v))); return V.map(v => v.map(c => c / m)); };
const edges = V => { let m = 1e9; for (let a = 0; a < V.length; a++) for (let b = a + 1; b < V.length; b++) m = Math.min(m, Math.hypot(...V[a].map((c, k) => c - V[b][k]))); const E = []; for (let a = 0; a < V.length; a++) for (let b = a + 1; b < V.length; b++) if (Math.abs(Math.hypot(...V[a].map((c, k) => c - V[b][k])) - m) < 1e-4) E.push([a, b]); return E; };
