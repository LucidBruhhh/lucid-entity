<style>
:root{--lime:#c7ff16;--cyan:#3fe0ff;--fg:#efeaff;--fg2:rgba(239,234,255,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--fg);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;font-family:Rajdhani,Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%!important;height:100%!important;display:block}
.badge{position:fixed;top:max(16px,calc(env(safe-area-inset-top) + 8px));left:18px;z-index:5;font:600 9px/1.6 "JetBrains Mono",monospace;letter-spacing:.24em;text-transform:uppercase;color:rgba(199,255,22,.8)}
.badge b{display:block;color:var(--fg2);font-weight:400}
.lock{position:fixed;top:max(16px,calc(env(safe-area-inset-top) + 8px));right:16px;z-index:5;display:flex;align-items:center;gap:6px;font:700 10px/1 Rajdhani,Arial,sans-serif;letter-spacing:.08em;color:#eee;opacity:.85}
.lock img{width:20px;height:20px}.lock i{font-style:normal;background:var(--lime);color:#000;padding:2px 4px 1px;margin-left:2px}
.title{position:fixed;left:0;right:0;top:var(--ty,72%);transform:translateY(-50%);text-align:center;z-index:5;pointer-events:none;transition:top 1.2s cubic-bezier(.7,0,.2,1),opacity .8s}
.logo{font:300 clamp(58px,19vw,112px)/.9 "Cormorant Garamond",Georgia,serif;letter-spacing:.3em;margin-right:-.3em;color:#fff;text-shadow:-2px 0 rgba(255,45,180,.6),2px 0 rgba(60,230,255,.6),0 0 40px rgba(63,224,255,.4);transition:font-size 1.2s cubic-bezier(.7,0,.2,1)}
.sub{margin-top:12px;font:700 12px/1 Rajdhani,Arial,sans-serif;letter-spacing:.62em;margin-right:-.62em;color:var(--lime);text-shadow:0 0 12px rgba(199,255,22,.6);opacity:0;transition:opacity 1.4s}
.tag{margin:14px auto 0;max-width:310px;font:300 italic 17px/1.35 "Cormorant Garamond",Georgia,serif;color:var(--fg2);opacity:0;transition:opacity 1.4s .4s}
.decoded .sub,.decoded .tag{opacity:1}
.tap{position:fixed;left:0;right:0;bottom:max(56px,calc(env(safe-area-inset-bottom) + 48px));text-align:center;z-index:5;font:700 12px/1 Rajdhani,Arial,sans-serif;letter-spacing:.6em;margin-right:-.6em;color:#fff;opacity:0;transition:opacity 1s .8s;pointer-events:none}
.decoded .tap{opacity:1;animation:breathe 2.4s 2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.25}}
.begun .tap{display:none}
.begun .logo{font-size:clamp(40px,12vw,64px)}.begun .tag{opacity:0;transition:opacity .4s}
.reveal .title{opacity:0}
.menu{position:fixed;left:50%;bottom:max(56px,calc(env(safe-area-inset-bottom) + 48px));transform:translate(-50%,40px);width:min(84vw,330px);display:flex;flex-direction:column;gap:10px;z-index:6;opacity:0;pointer-events:none;transition:opacity .8s .4s,transform .9s .4s cubic-bezier(.2,1.3,.4,1)}
.begun .menu{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.reveal .menu{opacity:0;transform:translate(-50%,60px);pointer-events:none;transition:opacity .5s,transform .6s}
.menu button{position:relative;padding:16px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(6,8,14,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:700 15px/1 Rajdhani,Arial,sans-serif;letter-spacing:.4em;text-transform:uppercase;cursor:pointer;overflow:hidden}
.menu button.p{background:var(--lime);color:#000;border-color:var(--lime);box-shadow:0 0 34px rgba(199,255,22,.5)}
.menu button.p::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);background-size:250% 100%;animation:sheen 2.6s ease-in-out infinite}
@keyframes sheen{from{background-position:130% 0}to{background-position:-130% 0}}
.menu small{display:block;margin-top:6px;font:400 9px/1 "JetBrains Mono",monospace;letter-spacing:.2em;color:var(--fg2)}
.menu .p small{color:rgba(0,0,0,.6)}
.shape{position:fixed;left:0;right:0;bottom:max(92px,calc(env(safe-area-inset-bottom) + 84px));text-align:center;z-index:6;pointer-events:none;opacity:0;transition:opacity .6s}
.reveal .shape{opacity:1}
.shape .n{font:700 10px/1 "JetBrains Mono",monospace;letter-spacing:.4em;color:rgba(63,224,255,.85);text-shadow:0 0 10px rgba(63,224,255,.7)}
.shape .h{margin-top:10px;font:700 22px/1 Rajdhani,Arial,sans-serif;letter-spacing:.42em;margin-right:-.42em;color:#fff;text-shadow:0 0 18px rgba(199,255,22,.6)}
.shape .s{margin-top:10px;font:300 italic 16px/1.3 "Cormorant Garamond",Georgia,serif;color:var(--fg2)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2)}.dots i.on{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.enter{position:fixed;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom) + 20px));transform:translateX(-50%);z-index:7;border:0;border-radius:999px;padding:13px 26px;background:var(--lime);color:#000;font:700 13px/1 Rajdhani,Arial,sans-serif;letter-spacing:.4em;text-transform:uppercase;box-shadow:0 0 30px rgba(199,255,22,.55);opacity:0;pointer-events:none;transition:opacity .6s;cursor:pointer}
.ended .enter{opacity:1;pointer-events:auto}
.skip{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));text-align:center;z-index:5;font:400 8.5px/1 "JetBrains Mono",monospace;letter-spacing:.24em;color:rgba(255,255,255,.3);text-transform:uppercase}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
.err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;color:var(--fg2);font:400 13px/1.6 "JetBrains Mono",monospace;z-index:9}
</style>
</head>

  { n: 'V · aether', h: 'Dodecahedron', s: 'The fifth element. What the universe is drawn on.', V: dod, E: edgesByMin(dod), col: VIOLET, s3: 1.05 },

  { n: 'VII · 4D', h: '24-cell', s: 'It has no shadow in our world. Only in four dimensions. Like me.', V4: norm(c24), E: edgesByMin(c24), col: LIME, s3: 1.45 },
];
const NSEG = Math.max(...SHAPES.map(s => s.E.length)); // 96, the 24-cell
const cur = new Float32Array(NSEG * 6), tgt = new Float32Array(NSEG * 6), segA = new Float32Array(NSEG * 2);
const segGeo = new THREE.BufferGeometry(); segGeo.setAttribute('position', new THREE.BufferAttribute(cur, 3)); segGeo.setAttribute('alpha', new THREE.BufferAttribute(segA, 1));
const segMat = new THREE.ShaderMaterial({ uniforms: { uCol: { value: LIME.clone() }, uA: { value: 1 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `attribute float alpha; varying float vA; varying float vZ; void main(){ vA = alpha; vec4 mv = modelViewMatrix * vec4(position,1.); vZ = mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform vec3 uCol; uniform float uA; varying float vA; varying float vZ; void main(){ float depth = clamp(1.2 + (vZ + 6.) * .35, .35, 1.4); gl_FragColor = vec4(uCol * depth * 1.25, vA * uA); }` });
const segs = new THREE.LineSegments(segGeo, segMat); segs.frustumCulled = false;
// a ghost copy, larger and colder: a chromatic echo of the same lines a little out of phase
const ghost = new THREE.LineSegments(segGeo, new THREE.ShaderMaterial({ uniforms: { uCol: { value: CYAN.clone() }, uA: { value: .28 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexShader: segMat.vertexShader, fragmentShader: segMat.fragmentShader }));
ghost.scale.setScalar(1.035); ghost.frustumCulled = false;
// glowing nodes on every vertex
const nodePos = new Float32Array(NSEG * 6); const nodeGeo = new THREE.BufferGeometry(); nodeGeo.setAttribute('position', new THREE.BufferAttribute(nodePos, 3));
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.25, 'rgba(255,255,255,.6)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const nodes = new THREE.Points(nodeGeo, new THREE.PointsMaterial({ size: .07, opacity: .8, map: glowTex, color: 0xe8ffd0, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); nodes.frustumCulled = false;
const sacred = new THREE.Group(); sacred.add(ghost, segs, nodes); scene.add(sacred);
// the 13 spheres of the flower: each a gyroscope of three rings, flat until the cube wakes, then they open into spheres
const ringGeo = new THREE.BufferGeometry().setFromPoints([...Array(65)].map((_, i) => new THREE.Vector3(Math.cos(i / 64 * 6.283), Math.sin(i / 64 * 6.283), 0)));
const ringMat = new THREE.LineBasicMaterial({ color: LIME, transparent: true, opacity: .3, blending: THREE.AdditiveBlending, depthWrite: false });
const spheres = met.map(p => { const g = new THREE.Group(); g.position.set(...p).multiplyScalar(1.15); const rs = [0, 1, 2].map(k => { const l = new THREE.Line(ringGeo, ringMat); g.add(l); return l; }); g.scale.setScalar(.25 * 1.15); sacred.add(g); g.userData.rs = rs; return g; });

/* ---------- the eye at the heart of it: the Lucid Instinct eye as a living shader ---------- */
const eyeU = { uTex: { value: null }, uTime: { value: 0 }, uOpen: { value: 0 }, uDil: { value: 0 }, uGlow: { value: .5 }, uLook: { value: new THREE.Vector2() } };
new THREE.TextureLoader().load(EYE_SRC, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; eyeU.uTex.value = t; });
const eye = new THREE.Mesh(new THREE.PlaneGeometry(1, 1, 1, 1), new THREE.ShaderMaterial({ uniforms: eyeU, transparent: true, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D uTex; uniform float uTime, uOpen, uDil, uGlow; uniform vec2 uLook; varying vec2 vUv;
  void main(){
    vec2 p = vUv - .5; float r = length(p) * 2.; float a = atan(p.y, p.x);
    // the iris and the lettering ring turn against each other; the pupil breathes and dilates
    float spin = mix(uTime * .06, -uTime * .025, smoothstep(.40, .47, r));
    float rr = r;
    if (r < .41) { float pupil = .19 + uDil * .07 + .012 * sin(uTime * 1.3); float k = r / .41; rr = mix(pupil / .19 * .19, .41, smoothstep(0., 1., k)); rr = r < pupil ? r * .19 / pupil : mix(.19, .41, (r - pupil) / (.41 - pupil)); }
    vec2 q = vec2(cos(a + spin), sin(a + spin)) * rr * .5 + .5;
    q += uLook * .012 * smoothstep(.45, .1, r); // the iris shifts a little toward you
    vec3 c = texture2D(uTex, q).rgb;
    float lum = max(c.r, max(c.g, c.b));
    float iris = smoothstep(.43, .40, r) * smoothstep(.15, .21, rr);
    c += vec3(.12, .75, 1.) * iris * (.25 + .55 * uGlow) * (.6 + .4 * sin(a * 24. + uTime * 2.));
    c += vec3(.25, .9, 1.) * smoothstep(.46, .40, r) * smoothstep(.32, .40, r) * .35 * uGlow;
    // inside the iris it is solid; the lettering ring keeps its white letters and lets the cube show between them
    float alpha = r < .44 ? 1. : smoothstep(.12, .45, lum);
    alpha *= smoothstep(.99, .95, r);
    // it opens from the centre outward
    float o = smoothstep(uOpen * 1.15 - .08, uOpen * 1.15, r); alpha *= 1. - o;
    c += vec3(.8, 1., .6) * (1. - o) * smoothstep(uOpen * 1.15 - .12, uOpen * 1.15, r) * (1. - uOpen) * 3.;
    gl_FragColor = vec4(c, alpha);
  }` }));
eye.renderOrder = 10; scene.add(eye);
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: CYAN, transparent: true, opacity: .0, blending: THREE.AdditiveBlending, depthWrite: false })); halo.renderOrder = 9; scene.add(halo);
const world = new THREE.Group(); scene.add(world); world.add(sacred, halo); // lifted so the cube sits above the title and the menu
// the eye is drawn after the bloom, in its own scene, so the artwork stays crisp while the lines around it glow
const eyeScene = new THREE.Scene(), eyeWorld = new THREE.Group(); eyeScene.add(eyeWorld); eyeWorld.add(eye);

/* ---------- post: bloom, then a lens: chromatic fringes, vignette, grain, faint scanlines ---------- */
const composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), .75, .5, .18); composer.addPass(bloom);
const lens = new ShaderPass({ uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uAb: { value: .0025 }, uFlash: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uTime, uAb, uFlash; varying vec2 vUv;
  float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
  void main(){ vec2 c = vUv - .5; float d = dot(c, c); vec2 o = c * (uAb + uFlash * .02) * (1. + d * 6.);
    vec3 col = vec3(texture2D(tDiffuse, vUv + o).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - o).b);
    col *= 1. - d * 1.35; col *= .96 + .04 * sin(vUv.y * 900. + uTime * 4.);
    col += (h(vUv * 811. + fract(uTime)) - .5) * .045; col += uFlash * .8;
    gl_FragColor = vec4(col, 1.); }` });
const eyePass = new RenderPass(eyeScene, camera); eyePass.clear = false; eyePass.clearDepth = true; composer.addPass(eyePass);
composer.addPass(new OutputPass()); composer.addPass(lens); // the lens works on the final picture, so its grain never lifts the blacks

/* ---------- sound: a drone underneath, blips while decrypting, a chord to begin, a tone for each shape ---------- */
let AC, drone; const au = () => { if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch {} AC?.state === 'suspended' && AC.resume(); return AC; };
function tone(f, d = 1, type = 'sine', g = .08, slide = 1, delay = 0) { const a = au(); if (!a) return; const o = a.createOscillator(), v = a.createGain(), n = a.currentTime + delay; o.type = type; o.frequency.setValueAtTime(f, n); if (slide !== 1) o.frequency.exponentialRampToValueAtTime(f * slide, n + d); v.gain.setValueAtTime(.0001, n); v.gain.exponentialRampToValueAtTime(g, n + .03); v.gain.exponentialRampToValueAtTime(.0001, n + d); o.connect(v).connect(a.destination); o.start(n); o.stop(n + d + .1); }
function startDrone() { const a = au(); if (!a || drone) return; const g = a.createGain(); g.gain.value = 0; g.connect(a.destination); const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.connect(g);
  [55, 82.41, 110.3, 164.8].forEach((f, i) => { const o = a.createOscillator(); o.type = i ? 'sine' : 'sawtooth'; o.frequency.value = f; o.detune.value = (i - 1.5) * 4; const og = a.createGain(); og.gain.value = i ? .05 : .03; o.connect(og).connect(lp); o.start(); });
  g.gain.setTargetAtTime(.5, a.currentTime, 2); drone = { g, lp }; }
const buzz = p => { try { if (navigator.userActivation?.hasBeenActive) navigator.vibrate?.(p); } catch {} };
function flash(k = 1) { lens.uniforms.uFlash.value = k; const f = $('flash'); f.style.transition = 'none'; f.style.opacity = .55 * k; requestAnimationFrame(() => { f.style.transition = 'opacity 1.4s'; f.style.opacity = 0; }); }

/* ---------- state ---------- */
const st = { phase: 'decrypt', dec: 0, shape: 0, shapeT: 0, beginT: 0, playT: 0, ended: false, lastLetter: -1 };
const P = { x: 0, y: 0, tx: 0, ty: 0, down: false };
addEventListener('pointermove', e => { P.tx = e.clientX / innerWidth * 2 - 1; P.ty = e.clientY / innerHeight * 2 - 1; });
addEventListener('deviceorientation', e => { if (e.gamma == null) return; P.tx = Math.max(-1, Math.min(1, e.gamma / 30)); P.ty = Math.max(-1, Math.min(1, (e.beta - 45) / 30)); });
const dots = $('dots'); SHAPES.forEach(() => dots.appendChild(document.createElement('i')));
function showShape(i) { const s = SHAPES[i]; st.shape = i; st.shapeT = clock; $('shN').textContent = s.n.toUpperCase(); $('shH').textContent = s.h.toUpperCase(); $('shS').textContent = s.s; [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
  const notes = [130.8, 196, 220, 261.6, 293.7, 329.6, 392, 523.3]; tone(notes[i], 2.6, 'sine', .09); tone(notes[i] * 2, 1.8, 'triangle', .03, 1, .05); tone(notes[i] * 3, 1.2, 'sine', .015, 1, .1); tone(1800, .6, 'sine', .02, .25); buzz(i >= 6 ? [20, 30, 60] : 18);
  if (i >= 6) flash(.6); }
renderer.domElement.addEventListener('pointerdown', e => { P.down = true; au(); startDrone();
  if (st.phase === 'decrypt') { st.dec = Math.max(st.dec, .82); }
  else if (st.phase === 'title') { st.phase = 'menu'; st.beginT = clock; body.classList.add('begun'); $('title').style.setProperty('--ty', '17%'); flash(.8); [55, 82.4, 110, 164.8, 220, 329.6, 440].forEach((f, i) => tone(f, 4 - i * .3, i < 2 ? 'sawtooth' : 'sine', i < 2 ? .05 : .06, 1, i * .06)); buzz([20, 40, 120]); }
  else if (st.phase === 'reveal') { showShape((st.shape + 1) % SHAPES.length); } });
addEventListener('pointerup', () => P.down = false); addEventListener('pointercancel', () => P.down = false);
$('play').onclick = e => { e.stopPropagation(); au(); startDrone(); st.phase = 'reveal'; st.playT = clock; body.classList.add('reveal'); flash(1); tone(55, 5, 'sawtooth', .07, .5); showShape(1); };
for (const id of ['scan', 'codex']) $(id).onclick = e => { e.stopPropagation(); tone(880, .2, 'sine', .07); tone(1320, .3, 'sine', .05, 1, .05); buzz(15); };
$('enter').onclick = e => { e.stopPropagation(); flash(1); tone(65.4, 3, 'sawtooth', .08, .25); $('skip').textContent = 'concept: here the game itself would begin'; };

/* ---------- resize: keep the whole cube in view on any phone ---------- */
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); composer.setSize(w, h); bloom.resolution.set(w / 2, h / 2); camera.aspect = w / h;
  camera.position.z = 1.45 / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * Math.min(camera.aspect, 1)); camera.updateProjectionMatrix();
  const hh = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * (camera.position.z + 9) * 2; rain.scale.set(hh * camera.aspect * 1.1, hh * 1.1, 1); }
addEventListener('resize', resize); resize();

/* ---------- the frame ---------- */
let clock = 0, last = performance.now();
const tmpV = new THREE.Vector3();
function frame(now) { requestAnimationFrame(frame); const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  try { step(dt); } catch (e) { console.warn(e); }
  composer.render(); }
function step(dt) {
  P.x += (P.tx - P.x) * .05; P.y += (P.ty - P.y) * .05;
  // decryption: the name, the lines of the cube, then the eye opening
  if (st.phase === 'decrypt') { st.dec = Math.min(1, st.dec + dt * .16); if (st.dec >= 1) { st.phase = 'title'; body.classList.add('decoded'); flash(.5); tone(110, 3, 'sine', .08); tone(165, 3, 'sine', .05, 1, .1); } }
  const want = 'AEON'; let s = ''; for (let i = 0; i < 4; i++) s += st.dec * 4.4 > i + 1.2 ? want[i] : GL[Math.floor(Math.random() * GL.length)];
  if ($('logo').textContent !== s) { $('logo').textContent = s; const n = (s.match(/[AEON]/g) || []).length; if (n !== st.lastLetter) { if (n > st.lastLetter && st.lastLetter >= 0) tone(440 * Math.pow(1.5, n - 1), .5, 'sine', .06); st.lastLetter = n; } }
  $('badge2').textContent = st.dec < 1 ? `decrypting ${Math.floor(st.dec * 100)}%` : st.phase === 'reveal' ? 'the cube is open' : 'transmission decrypted';
  drawRain(dt, st.phase === 'decrypt' ? 1 : st.phase === 'reveal' ? 2.2 : 1.3);
  // reveal: a new hidden shape every few seconds, then the way in
  if (st.phase === 'reveal') { if (clock - st.shapeT > 4.2) { const nx = (st.shape + 1) % SHAPES.length; showShape(nx); if (nx === 0) { body.classList.add('ended'); } } }
  lens.uniforms.uFlash.value *= Math.exp(-dt * 3); lens.uniforms.uTime.value = clock;
  // targets for every segment: the current shape, turning in 3D or through 4D
  const S = SHAPES[st.phase === 'reveal' ? st.shape : 0], E = S.E, sc = S.s3 * (st.phase === 'reveal' && st.shape ? 1.5 : 1), t = clock; // the hidden shapes are shown large: they are the point
  const V = S.V4 ? S.V4.map(v => rot4(v, t, st.shape === 7 ? -1 : 1)) : S.V;
  const drawn = st.phase === 'decrypt' ? Math.floor(ease(Math.min(1, st.dec * 1.25)) * E.length) : E.length;
  for (let i = 0; i < NSEG; i++) { const o = i * 6; if (i < E.length) { const a = V[E[i][0]], b = V[E[i][1]]; tgt[o] = a[0] * sc; tgt[o + 1] = a[1] * sc; tgt[o + 2] = a[2] * sc; tgt[o + 3] = b[0] * sc; tgt[o + 4] = b[1] * sc; tgt[o + 5] = b[2] * sc; }
    else { for (let k = 0; k < 6; k++) tgt[o + k] = 0; }
    const on = i < Math.min(drawn, E.length) ? 1 : 0; segA[i * 2] += (on * .9 - segA[i * 2]) * Math.min(1, dt * 6); segA[i * 2 + 1] = segA[i * 2]; }
  const kk = 1 - Math.exp(-dt * (st.phase === 'reveal' ? 3.2 : 6)); for (let i = 0; i < cur.length; i++) cur[i] += (tgt[i] - cur[i]) * kk;
  nodePos.set(cur); segGeo.attributes.position.needsUpdate = true; segGeo.attributes.alpha.needsUpdate = true; nodeGeo.attributes.position.needsUpdate = true;
  segMat.uniforms.uCol.value.lerp(S.col, Math.min(1, dt * 2)); ghost.material.uniforms.uCol.value.lerp(S.col === LIME ? CYAN : LIME, Math.min(1, dt * 2));
  // the whole sacred object: flat while it decrypts, waking into 3D after the tap, turning freely once it is open
  const wake = st.phase === 'decrypt' || st.phase === 'title' ? 0 : Math.min(1, (clock - st.beginT) / 2.5);
  const free = st.phase === 'reveal' ? 1 : 0;
  sacred.rotation.x = P.y * .25 + wake * Math.sin(clock * .25) * .35 + free * clock * .18;
  sacred.rotation.y = P.x * .35 + wake * Math.sin(clock * .19) * .55 + free * clock * .27;
  sacred.rotation.z = clock * .03;
  const sphA = st.phase === 'reveal' ? 0 : Math.min(1, st.dec * 1.6); ringMat.opacity += ((st.phase === 'reveal' && st.shape !== 0 ? 0 : sphA * .28) - ringMat.opacity) * Math.min(1, dt * 3);
  spheres.forEach((g, i) => { const [r0, r1, r2] = g.userData.rs; r1.rotation.x = Math.PI / 2 * wake; r2.rotation.y = Math.PI / 2 * wake; g.rotation.y = clock * (.3 + i * .02) * wake; g.rotation.x = clock * .2 * wake; });
  // the eye: opens late in the decryption, glows when touched, follows you
  const open = st.phase === 'decrypt' ? Math.max(0, (st.dec - .62) / .38) : 1;
  eyeU.uOpen.value += (open - eyeU.uOpen.value) * Math.min(1, dt * 4); eyeU.uTime.value = clock;
  eyeU.uDil.value += ((P.down ? 1 : 0) + (st.phase === 'reveal' ? .4 * Math.sin(clock * 2) : 0) - eyeU.uDil.value) * Math.min(1, dt * 3);
  eyeU.uGlow.value = .5 + .3 * Math.sin(clock * 1.7) + (P.down ? .5 : 0); eyeU.uLook.value.set(P.x, -P.y);
  const es = (st.phase === 'reveal' ? .62 : 1.22) * (1 + .015 * Math.sin(clock * 1.1)); eye.scale.setScalar(es); eye.rotation.set(-P.y * .18, P.x * .22, 0);
  halo.scale.setScalar(es * 2.6); halo.material.opacity = .14 * eyeU.uOpen.value * (.7 + .3 * Math.sin(clock * 1.7));
  bloom.strength = .72 + (st.phase === 'reveal' ? .38 : 0) + lens.uniforms.uFlash.value * 1.1;
  world.position.y += ((st.phase === 'reveal' ? .45 : .78) - world.position.y) * Math.min(1, dt * 2); eyeWorld.position.copy(world.position);
  camera.position.x = P.x * .25; camera.position.y = -P.y * .2; camera.lookAt(0, 0, 0);
}
requestAnimationFrame(frame);
// test hook: advance time in fixed steps (a hidden browser tab barely animates)
window.cipher = { st, showShape, eyeU, eye, eyePass, bloom, composer, rain, halo, lens, scene, tick(sec) { for (let i = 0; i < sec * 30; i++) { clock += 1 / 30; step(1 / 30); } composer.render(); return st.phase; } };
</script>
</body>
</html>
